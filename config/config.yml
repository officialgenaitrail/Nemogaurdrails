# Colang 1.0 syntax is the default; built-in self-check rails work without custom .co files.
# app.py synchronizes model and base_url from your .env file before initialization.
models:
  - type: main
    engine: openai
    model: openrouter/free
    api_key_env_var: OPENROUTER_API_KEY
    parameters:
      base_url: https://openrouter.ai/api/v1

rails:
  input:
    flows:
      - self check input
  output:
    flows:
      - self check output
